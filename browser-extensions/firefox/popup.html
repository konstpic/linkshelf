<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      padding: 14px 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      margin: 0;
    }
    h3 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
    p { margin: 0 0 12px; color: #666; line-height: 1.4; }
    button {
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #6366f1;
      color: white;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { background: #5558e3; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <h3>Add to LinkShelf</h3>
  <p>Add the current page to your LinkShelf collection.</p>
  <button id="add-btn">Add current page</button>
  <script src="popup.js"></script>
</body>
</html>
